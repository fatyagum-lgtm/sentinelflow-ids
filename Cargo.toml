[package]
name = "sentinelflow-ids"
version = "0.1.0"
edition = "2024"
default-run = "sentinelflow-ids"
license = "MIT"
description = "Bounded offline streaming anomaly detection research"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
